[tool.poetry]
name = "speechlab"
version = "0.1.0"
description = "Contrastive Speech Analytics & Temporal Flaw Grounding"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "speechlab", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.110.0"
uvicorn = {extras = ["standard"], version = "0.29.0"}
python-multipart = "0.0.7"
librosa = "0.10.1"
numpy = "1.26.4"
pandas = "2.2.2"
scipy = "1.13.0"
soundfile = "0.12.1"
requests = "2.31.0"
pyarrow = "15.0.0"
matplotlib = "3.8.4"
seaborn = "0.13.2"

[tool.poetry.dev-dependencies]
ruff = "0.3.5"
black = "24.3.0"
pytest = "8.1.1"
pytest-cov = "5.0.0"

[tool.poetry.scripts]
speechlab = "speechlab.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
